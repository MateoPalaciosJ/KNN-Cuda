[build-system]
requires = ["setuptools>=61", "torch>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knn-cuda"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "torch>=2.0"
]
[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src/python"}

[tool.setuptools.packages.find]
where = ["src/python"]
